groups:
  - name: nbbang
    rules:
      - alert: NbbangBackendDown
        expr: up{job="nbbang-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: NBBANG backend is down
      - alert: NbbangHighServerErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="nbbang-backend",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="nbbang-backend"}[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NBBANG HTTP 5xx rate is above 5%
      - alert: NbbangHighJvmHeap
        expr: >-
          sum(jvm_memory_used_bytes{job="nbbang-backend",area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{job="nbbang-backend",area="heap"}), 1) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NBBANG JVM heap usage is above 85%
