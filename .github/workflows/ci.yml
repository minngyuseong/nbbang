name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and package
        run: ./gradlew test bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          POSTGRES_DB: nbbang
          POSTGRES_USER: nbbang
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          KAKAO_CLIENT_ID: ci-kakao-client
          KAKAO_CLIENT_SECRET: ci-kakao-client-secret
          GOOGLE_CLIENT_ID: ci-google-client
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          ACCOUNT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          VAPID_PUBLIC_KEY: ci-vapid-public-key
          VAPID_PRIVATE_KEY: ci-vapid-private-key
          VAPID_SUBJECT: mailto:ci@example.com
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose -f compose.prod.yaml config --quiet
